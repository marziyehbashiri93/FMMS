<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ورود | FMMS</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/web/woff2/JetBrainsMono.css" rel="stylesheet" onerror="this.remove()"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"/>
    <link href="css/base/variables.css" rel="stylesheet"/>
    <link href="css/base/reset.css" rel="stylesheet"/>
    <link href="css/base/typography.css" rel="stylesheet"/>
    <link href="css/base/common.css" rel="stylesheet"/>

    <link href="css/components/forms.css" rel="stylesheet"/>
</head>
<body data-auth-page="login">
<!-- =====================================================================
     LOGIN
     ===================================================================== -->
<div id="login-screen">
    <div class="login-card">
        <h1 class="login-title">FMMS Control Center</h1>

        <form id="login-form" novalidate>
            <div class="mb-3 login-form-inpt">
                <label class="form-label" for="login-email">ایمیل</label>
                <input type="email" class="form-control" id="login-email" value="demo@demo.com" required/>
            </div>
            <div class="mb-3 login-form-inpt">
                <label class="form-label" for="login-password">رمزعبور</label>
                <input type="password" class="form-control" id="login-password" value="demo" required/>
            </div>
            <div id="login-error" class="text-danger small mb-2" style="display:none;"></div>
            <button type="submit" class="btn btn-fmms-primary w-100" id="login-submit">ورود</button>
        </form>
    </div>
</div>


<div id="toast-root"></div>
<div id="debug-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config/env.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/components/toast.js"></script>
</body>
</html>
