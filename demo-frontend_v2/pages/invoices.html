<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>فاکتورهای خارجی | FMMS</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/web/woff2/JetBrainsMono.css" rel="stylesheet" onerror="this.remove()"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"/>
    <link href="../css/base/variables.css" rel="stylesheet"/>
    <link href="../css/base/reset.css" rel="stylesheet"/>
    <link href="../css/base/typography.css" rel="stylesheet"/>
    <link href="../css/base/common.css" rel="stylesheet"/>
    <link href="../css/components/sidebar.css" rel="stylesheet"/>
    <link href="../css/components/header.css" rel="stylesheet"/>
    <link href="../css/components/breadcrumb.css" rel="stylesheet"/>
    <link href="../css/components/buttons.css" rel="stylesheet"/>
    <link href="../css/components/cards.css" rel="stylesheet"/>
    <link href="../css/components/tables.css" rel="stylesheet"/>
    <link href="../css/components/modal.css" rel="stylesheet"/>
    <link href="../css/components/badges.css" rel="stylesheet"/>
    <link href="../css/components/forms.css" rel="stylesheet"/>
<link href="../css/pages/transport.css" rel="stylesheet"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b8fd4'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' fill='white' text-anchor='middle' font-weight='700'%3EFM%3C/text%3E%3C/svg%3E"/>
</head>
<body data-page="invoices" >
<div id="app-shell" class="active">
    <div id="app-header"></div>
    <div class="shell-body">
        <aside class="sidebar" id="app-sidebar"></aside>
        <main class="main">
            <div id="app-page-chrome" class="page-chrome-block" style="display:none;">
                <div class="page-hero card-fmms">
                    <div class="page-hero-content">
                        <h1 class="page-hero-title" id="page-chrome-title"></h1>
                        <nav class="page-breadcrumb" id="page-breadcrumb" aria-label="مسیر صفحه"></nav>
                    </div>
                </div>
                <div class="page-wizard card-fmms" id="page-chrome-wizard" style="display:none;"></div>
            </div>
<section class="page" id="page-transport">
                <div class="transport-view" data-transport-view="repairs">
                    <div class="faults-toolbar card-fmms p-3 mb-3">
                        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                            <span class="small text-muted me-1">نمایش:</span>
                            <button type="button" class="btn btn-fmms-outline btn-sm transport-filter-btn active"
                                    data-transport-filter="pending">در انتظار تایید
                            </button>
                            <button type="button" class="btn btn-fmms-outline btn-sm transport-filter-btn"
                                    data-transport-filter="all">همه دستورات تعمیر
                            </button>
                            <button type="button" class="btn btn-fmms-outline btn-sm transport-filter-btn"
                                    data-transport-filter="vehicle">دستورات این خودرو
                            </button>
                        </div>
                        <div id="transport-vehicle-filter-wrap" class="row g-2 align-items-end" style="display:none;">
                            <div class="col-md-6">
                                <label class="form-label small mb-1">خودرو</label>
                                <select id="transport-vehicle-filter" class="form-control form-control-sm"></select>
                            </div>
                            <div class="col-md-6">
                                <div id="transport-filter-hint" class="small text-muted">صف «در انتظار تایید»: خرابی‌هایی که توزیع روی آن‌ها تصمیم گرفته + دستور CREATED/APPROVED — API: GET /repair-orders/?vehicle_id=… (به ازای هر خودرو)
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="table-fmms-wrap mb-3">
                        <table class="table-fmms">
                            <thead>
                            <tr>
                                <th>خودرو</th>
                                <th>دستور تعمیر</th>
                                <th>وضعیت</th>
                                <th>تعمیرگاه</th>
                                <th>عملیات</th>
                            </tr>
                            </thead>
                            <tbody id="transport-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="transport-view" data-transport-view="materials" style="display:none;">
                    <div class="card-fmms p-3">
                        <div id="transport-material-requests"></div>
                    </div>
                </div>

                <div class="transport-view" data-transport-view="invoices" style="display:none;">
                    <div class="card-fmms p-3">
                        <div id="transport-external-invoices"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="debug-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../config/env.js"></script>
<script src="../js/mock-data.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/header.js"></script>
<script src="../js/components/breadcrumb.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/pages/repairs.js"></script>
</body>
</html>
