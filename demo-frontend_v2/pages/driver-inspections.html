<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>بازرسی روزانه خودرو | FMMS</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/web/woff2/JetBrainsMono.css" rel="stylesheet" onerror="this.remove()"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"/>
    <link href="../css/base/variables.css" rel="stylesheet"/>
    <link href="../css/base/reset.css" rel="stylesheet"/>
    <link href="../css/base/typography.css" rel="stylesheet"/>
    <link href="../css/base/common.css" rel="stylesheet"/>
    <link href="../css/components/sidebar.css" rel="stylesheet"/>
    <link href="../css/components/header.css" rel="stylesheet"/>
    <link href="../css/components/breadcrumb.css" rel="stylesheet"/>
    <link href="../css/components/buttons.css" rel="stylesheet"/>
    <link href="../css/components/cards.css" rel="stylesheet"/>
    <link href="../css/components/tables.css" rel="stylesheet"/>
    <link href="../css/components/modal.css" rel="stylesheet"/>
    <link href="../css/components/badges.css" rel="stylesheet"/>
    <link href="../css/components/forms.css" rel="stylesheet"/>
<link href="../css/pages/inspections.css" rel="stylesheet"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b8fd4'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' fill='white' text-anchor='middle' font-weight='700'%3EFM%3C/text%3E%3C/svg%3E"/>
</head>
<body data-page="driver-inspections" data-view="inspection">
<div id="app-shell" class="active">
    <div id="app-header"></div>
    <div class="shell-body">
        <aside class="sidebar" id="app-sidebar"></aside>
        <main class="main">
            <div id="app-page-chrome" class="page-chrome-block" style="display:none;">
                <div class="page-hero card-fmms">
                    <div class="page-hero-content">
                        <h1 class="page-hero-title" id="page-chrome-title"></h1>
                        <nav class="page-breadcrumb" id="page-breadcrumb" aria-label="مسیر صفحه"></nav>
                    </div>
                </div>
                <div class="page-wizard card-fmms" id="page-chrome-wizard" style="display:none;"></div>
            </div>
<section class="page" id="page-inspection">
                <div class="page-wizard card-fmms" id="inspection-wizard">
                    <div class="page-wizard-inner">
                        <div class="page-wizard-step current" data-step="1">
                            <span class="page-wizard-dot">1</span>
                            <span class="page-wizard-label">انتخاب خودرو</span>
                        </div>
                        <div class="page-wizard-step" data-step="2">
                            <span class="page-wizard-dot">2</span>
                            <span class="page-wizard-label">تکمیل چک‌لیست</span>
                        </div>
                        <div class="page-wizard-step" data-step="3">
                            <span class="page-wizard-dot">3</span>
                            <span class="page-wizard-label">ثبت نتیجه</span>
                        </div>
                    </div>
                </div>

                <div id="driver-step-1">
                    <div class="card-fmms p-3 driver-vehicle-card">
                        <div class="inspection-card-header">
                            <span class="inspection-card-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2.7-3.6a1 1 0 0 0-.8-.4H9.5a1 1 0 0 0-.8.4L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2"/>
                                    <circle cx="7" cy="17" r="2"/>
                                    <circle cx="17" cy="17" r="2"/>
                                </svg>
                            </span>
                            <label class="form-label">انتخاب خودرو</label>
                        </div>
                        <div class="inspection-vehicle-body">
                            <div id="inspection-selected-vehicle" class="selected-vehicle-summary text-muted">هنوز
                                خودرویی انتخاب نشده است.
                            </div>
                            <div class="inspection-empty-state" aria-hidden="true">
                                <div class="inspection-empty-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2.7-3.6a1 1 0 0 0-.8-.4H9.5a1 1 0 0 0-.8.4L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2"/>
                                        <circle cx="7" cy="17" r="2"/>
                                        <circle cx="17" cy="17" r="2"/>
                                    </svg>
                                </div>
                                <h2 class="inspection-empty-title">خودرویی انتخاب نشده است</h2>
                                <p class="inspection-empty-sub">برای شروع بازرسی، ابتدا یک خودرو را انتخاب کنید.</p>
                            </div>
                        </div>
                        <div class="inspection-actions d-flex flex-wrap gap-2">
                            <button class="btn btn-fmms-primary" type="button" id="inspection-open-vehicle-modal">انتخاب
                                خودرو
                            </button>
                            <button class="btn btn-fmms-outline" type="button" id="inspection-start-btn" disabled>شروع
                                بازرسی
                            </button>
                        </div>
                        <div id="inspection-no-vehicle-msg" class="alert-fmms alert-fmms-warn d-none">خودروی فعال برای
                            شروع بازرسی یافت نشد.
                        </div>
                        <input type="hidden" id="inspection-vehicle-id" value=""/>
                    </div>
                </div>

                <div id="driver-step-2" style="display:none;">
                    <div id="inspection-checklist"></div>
                    <button class="btn btn-fmms-success" type="button" id="inspection-submit-btn" disabled>ثبت نتیجه
                        بازرسی
                    </button>
                </div>

                <div id="driver-step-3" style="display:none;">
                    <div id="inspection-result"></div>
                    <button class="btn btn-fmms-outline mt-3" id="inspection-restart-btn">بازرسی جدید</button>
                </div>
            </section>
        </main>
    </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="debug-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../config/env.js"></script>
<script src="../js/mock-data.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/header.js"></script>
<script src="../js/components/breadcrumb.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/pages/inspections.js"></script>
</body>
</html>
