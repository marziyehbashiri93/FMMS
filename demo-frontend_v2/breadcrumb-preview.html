<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>Breadcrumb Header Preview</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/page-chrome.css" rel="stylesheet"/>
  <style>
    body { margin: 0; background: #f7f9fc; font-family: Vazirmatn, Tahoma, sans-serif; }
    .stack { display: grid; gap: 28px; max-width: 920px; margin: 0 auto; padding: 24px; }
    .label { font-size: 12px; font-weight: 700; color: #73829C; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="stack">
    <div id="shot-dashboard">
      <div class="label">Dashboard</div>
      <div class="page-chrome-block">
        <div class="page-hero card-fmms">
          <div class="page-hero-content">
            <h1 class="page-hero-title">داشبورد کنترل ناوگان</h1>
            <nav class="page-breadcrumb">
              <span class="bc-current">
                <svg class="bc-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z"/></svg>
                داشبورد
              </span>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div id="shot-inspection">
      <div class="label">Driver Inspection</div>
      <div class="page-chrome-block">
        <div class="page-hero card-fmms">
          <div class="page-hero-content">
            <h1 class="page-hero-title">بازرسی روزانه خودرو</h1>
            <nav class="page-breadcrumb">
              <a href="#">
                <svg class="bc-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z"/></svg>
                داشبورد
              </a>
              <span class="bc-sep">/</span>
              <span>راننده</span>
              <span class="bc-sep">/</span>
              <span class="bc-current">بازرسی روزانه خودرو</span>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div id="shot-transport">
      <div class="label">Transport</div>
      <div class="page-chrome-block">
        <div class="page-hero card-fmms">
          <div class="page-hero-content">
            <h1 class="page-hero-title">درخواست‌های تعمیر</h1>
            <nav class="page-breadcrumb">
              <a href="#">
                <svg class="bc-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z"/></svg>
                داشبورد
              </a>
              <span class="bc-sep">/</span>
              <span>ترابری</span>
              <span class="bc-sep">/</span>
              <span class="bc-current">درخواست‌های تعمیر</span>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div id="shot-repair">
      <div class="label">Repair</div>
      <div class="page-chrome-block">
        <div class="page-hero card-fmms">
          <div class="page-hero-content">
            <h1 class="page-hero-title">دستورات تعمیر</h1>
            <nav class="page-breadcrumb">
              <a href="#">
                <svg class="bc-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z"/></svg>
                داشبورد
              </a>
              <span class="bc-sep">/</span>
              <span>تعمیرات</span>
              <span class="bc-sep">/</span>
              <span class="bc-current">دستورات تعمیر</span>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
