[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ──────────────────────────────────────────────────────────────────────────────
# Black — code formatter
# ──────────────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | prototypes
)/
'''

# ──────────────────────────────────────────────────────────────────────────────
# isort — import sorter
# ──────────────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["apps", "core", "infrastructure", "interfaces", "config"]
known_third_party = ["django", "rest_framework", "celery", "environ", "factory"]
skip = ["migrations", ".venv", "prototypes"]
skip_glob = ["*/migrations/*"]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — fast linter
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "prototypes",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (disallow print)
]
ignore = [
    "S101",  # assert used (ok in tests)
    "S105",  # hardcoded password (false positives in tests)
    "S106",  # hardcoded password (false positives)
    "B008",  # do not perform function calls in default arguments (DRF pattern)
    "N805",  # first argument of a method should be named self (cls in classmethods)
    "N818",  # exception base class does not require Error suffix
    "E501",  # line too long — enforced by black, not ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S311"]
"*/migrations/*.py" = ["E501", "N"]

# ──────────────────────────────────────────────────────────────────────────────
# mypy — static type checker
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
exclude = ["prototypes/"]
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "prototypes.*",
    "factory",
    "factory.*",
    "django_redis",
    "django_redis.*",
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
    "environ",
    "environ.*",
    "sentry_sdk",
    "sentry_sdk.*",
    "debug_toolbar",
    "debug_toolbar.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

# ──────────────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: pure unit tests (no database)",
    "integration: integration tests (requires database)",
    "sap: SAP adapter tests (uses mocked SAP)",
]

# ──────────────────────────────────────────────────────────────────────────────
# coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps", "core", "infrastructure", "interfaces"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/conftest.py",
    "prototypes/*",
    ".venv/*",
    "manage.py",
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
